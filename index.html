<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vault Viewer</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#1e1e24" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<script>
// 스크립트가 도중에 멈추면 빈 화면 대신 원인을 보여 준다
addEventListener('error', e => {
  const isScript = e instanceof ErrorEvent || (e.target && e.target.tagName === 'SCRIPT');
  const m = document.getElementById('main');
  if (!isScript || !m) return;
  const p = document.createElement('p');
  p.className = 'err';
  p.textContent = '스크립트 오류: ' + (e.message || '불러오지 못함 ' + e.target.src);
  m.append(p);
}, true);
</script>
<script src="vendor/marked.umd.js"></script>
<script src="vendor/purify.min.js"></script>
<style>
:root {
  --bg: #fafafa; --fg: #1f2328; --muted: #6a737d; --line: #e1e4e8;
  --link: #6c4bd8; --broken: #b35900; --code-bg: #f0f1f3; --bar: #ffffffee;
  --callout: #eef1ff; --callout-line: #6c4bd8;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1e1e24; --fg: #dcdde1; --muted: #8b8e98; --line: #34353d;
    --link: #a88bfa; --broken: #e3a15a; --code-bg: #2a2b33; --bar: #1e1e24ee;
    --callout: #2a2940; --callout-line: #a88bfa;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font: 17px/1.7 "Pretendard Variable", Pretendard, system-ui, sans-serif;
  word-break: keep-all; overflow-wrap: anywhere;
}
header {
  position: sticky; top: 0; z-index: 1; display: flex; align-items: center; gap: 8px;
  padding: calc(8px + env(safe-area-inset-top)) 16px 8px; background: var(--bar);
  backdrop-filter: blur(8px); border-bottom: 1px solid var(--line);
}
header .crumb { flex: 1; min-width: 0; font-size: 13px; color: var(--muted);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; direction: rtl; text-align: left; }
button {
  font: inherit; font-size: 15px; color: var(--fg); background: none;
  border: 1px solid var(--line); border-radius: 8px; padding: 8px 14px; min-height: 40px; cursor: pointer;
}
main { max-width: 760px; margin: 0 auto; padding: 16px 16px 64px; }
a { color: var(--link); text-decoration: none; }
.broken { color: var(--broken); }
.muted { color: var(--muted); }
.err { color: var(--broken); white-space: pre-wrap; }

/* 목록 */
#q { width: 100%; font: inherit; padding: 10px 12px; border: 1px solid var(--line);
  border-radius: 10px; background: var(--code-bg); color: var(--fg); margin-bottom: 12px; }
.tree details { margin-left: 4px; }
.tree details details, .tree details > .f { margin-left: 16px; }
.tree summary { padding: 10px 0; cursor: pointer; font-weight: 600; }
.tree .f, .results .f { display: block; padding: 10px 0; }
.results .f small { display: block; color: var(--muted); font-size: 12px; line-height: 1.3; }
.toolbar { display: flex; gap: 8px; justify-content: flex-end; margin-bottom: 8px; }

/* 노트 */
.note img { max-width: 100%; height: auto; border-radius: 6px; }
.note h1, .note h2, .note h3 { line-height: 1.35; margin: 1.6em 0 .6em; }
.note :is(h1,h2,h3,h4,h5,h6) { scroll-margin-top: 64px; }
.note h1 { font-size: 1.6em; } .note h2 { font-size: 1.3em; border-bottom: 1px solid var(--line); padding-bottom: .2em; }
.note code { background: var(--code-bg); padding: .1em .35em; border-radius: 4px; font-size: .88em; }
.note pre { background: var(--code-bg); padding: 12px; border-radius: 8px; overflow-x: auto; line-height: 1.5; }
.note pre code { background: none; padding: 0; overflow-wrap: normal; word-break: normal; }
.note .scroll { overflow-x: auto; }
.note .mermaid { overflow-x: auto; margin: 1em 0; text-align: center; }
.note table { border-collapse: collapse; font-size: .92em; }
.note th, .note td { border: 1px solid var(--line); padding: 6px 10px; vertical-align: top; }
.note th { background: var(--code-bg); }
.note td { word-break: normal; overflow-wrap: normal; min-width: 5em; }
.note blockquote { margin: 1em 0; padding: 2px 14px; border-left: 3px solid var(--line); color: var(--muted); }
.note blockquote.callout { background: var(--callout); border-left-color: var(--callout-line); color: var(--fg); border-radius: 6px; }
.note .callout-title { font-weight: 700; margin-top: 8px; text-transform: capitalize; }
.note hr { border: 0; border-top: 1px solid var(--line); }
.note li > input[type=checkbox] { margin-right: 6px; }
.note li:has(> input[type=checkbox]) { list-style: none; margin-left: -1.2em; }

/* 설정 */
.setup label { display: block; margin: 14px 0 4px; font-weight: 600; }
.setup input { width: 100%; font: inherit; padding: 10px 12px; border: 1px solid var(--line);
  border-radius: 10px; background: var(--code-bg); color: var(--fg); }
.setup ol { padding-left: 1.2em; font-size: 15px; }
.setup button { margin-top: 16px; padding: 8px 20px; }
</style>
</head>
<body>
<header>
  <button id="home" aria-label="목록">목록</button>
  <span class="crumb" id="crumb"></span>
  <button id="settings" aria-label="설정">설정</button>
</header>
<main id="main"></main>
<script>
const LS_TOKEN = 'vv.token', LS_REPO = 'vv.repo';
const IMG_TYPES = { png: 'image/png', jpg: 'image/jpeg', jpeg: 'image/jpeg', gif: 'image/gif', webp: 'image/webp', svg: 'image/svg+xml' };
const main = document.getElementById('main');
const crumb = document.getElementById('crumb');

let cfg = { token: '', repo: '' };
let branch = '';
let files = [];            // 볼트의 모든 파일 경로(점으로 시작하는 폴더 제외)
let query = '';            // 목록 검색어
let currentPath = '';
let homeScroll = 0;         // 목록으로 돌아왔을 때 스크롤 위치를 되살린다
const openDirs = new Set();  // 목록에서 펼쳐 둔 폴더
let renderSeq = 0;         // 빠르게 이동할 때 이전 요청 결과가 덮어쓰지 않게 한다
const imgCache = new Map(); // path -> object URL

const esc = s => s.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const encPath = p => p.split('/').map(encodeURIComponent).join('/');
const ext = p => (p.match(/\.([^./]+)$/) || [, ''])[1].toLowerCase();
const baseName = p => p.split('/').pop().replace(/\.md$/i, '');
const dec = s => { try { return decodeURIComponent(s); } catch { return s; } };
const hrefFor = (path, heading) => '#' + encodeURIComponent(path) + (heading ? '?h=' + encodeURIComponent(heading) : '');

// ---------- GitHub API ----------
async function api(path, accept) {
  const r = await fetch('https://api.github.com/repos/' + cfg.repo + path, {
    headers: { Authorization: 'Bearer ' + cfg.token, Accept: accept || 'application/vnd.github+json' },
    cache: 'no-cache',
  });
  if (r.status === 401) {
    localStorage.removeItem(LS_TOKEN);
    showSetup('토큰이 거부되었습니다(만료 또는 삭제). 새 토큰을 입력하세요.');
    throw new Error('401');
  }
  if (r.status === 404 && path === '')
    throw new Error('저장소 ' + cfg.repo + '를 찾을 수 없습니다.\n저장소 이름이 맞는지, 토큰 설정의 Repository access에 이 저장소가 선택되어 있는지 확인하세요.');
  if (!r.ok) throw new Error(r.status + ' ' + r.statusText + ' — ' + path);
  return r;
}
const raw = path => api('/contents/' + encPath(path) + '?ref=' + encodeURIComponent(branch), 'application/vnd.github.raw');

async function loadTree() {
  const repo = await (await api('')).json();
  branch = repo.default_branch;
  const t = await (await api('/git/trees/' + encodeURIComponent(branch) + '?recursive=1')).json();
  files = t.tree
    .filter(e => e.type === 'blob' && !e.path.split('/').some(s => s.startsWith('.')))
    .map(e => e.path);
}

// ---------- 링크 해석 (옵시디언과 같이: 파일명 일치, 여러 개면 가장 짧은 경로) ----------
function resolve(target) {
  const low = target.trim().replace(/^\/+/, '').toLowerCase();
  if (!low) return null;
  const hits = files.filter(p => {
    const l = p.toLowerCase();
    return l === low || l === low + '.md' || l.endsWith('/' + low) || l.endsWith('/' + low + '.md');
  });
  return hits.sort((a, b) => a.length - b.length)[0] || null;
}

// 일반 마크다운 링크의 상대 경로를 노트 위치 기준으로 푼다
function resolveRel(href, from) {
  const [p, frag = ''] = dec(href).split('#');
  if (!p) return { path: from, heading: frag };
  const parts = p.startsWith('/') ? [] : from.split('/').slice(0, -1);
  for (const s of p.split('/')) {
    if (s === '..') parts.pop();
    else if (s && s !== '.') parts.push(s);
  }
  const joined = parts.join('/');
  const hit = files.find(f => f === joined || f === joined + '.md') || resolve(p.split('/').pop());
  return hit ? { path: hit, heading: frag } : null;
}

// ---------- 마크다운 ----------
marked.use({
  gfm: true,
  breaks: true,
  extensions: [{
    name: 'wikilink',
    level: 'inline',
    start: src => src.indexOf('[['),
    tokenizer(src) {
      const m = /^(!?)\[\[([^\]\n]+)\]\]/.exec(src);
      if (m) return { type: 'wikilink', raw: m[0], embed: !!m[1], body: m[2] };
    },
    renderer(tok) {
      const [link, alias] = tok.body.replace(/\\\|/g, '|').split('|');
      const [name, heading = ''] = link.split('#');
      const path = name.trim() ? resolve(name) : currentPath;
      const label = esc(alias || (name.trim() ? name + (heading ? ' > ' + heading : '') : heading) || link);
      if (!path) return `<span class="broken">${label}</span>`;
      if (tok.embed && IMG_TYPES[ext(path)]) {
        const w = /^\d+/.exec(alias || '');
        return `<img data-src="${esc(path)}" alt="${esc(baseName(path))}"${w ? ` width="${w[0]}"` : ''}>`;
      }
      return `<a href="${hrefFor(path, heading)}">${tok.embed ? '↪ ' : ''}${label}</a>`;
    },
  }],
});

function stripFrontmatter(md) {
  return md.replace(/^﻿?---\r?\n[\s\S]*?\r?\n---[ \t]*(\r?\n|$)/, '');
}

// 렌더된 DOM을 옵시디언 표시에 맞게 고친다
function postProcess(root, from) {
  for (const a of root.querySelectorAll('a[href]')) {
    const href = a.getAttribute('href');
    if (/^[a-z][a-z0-9+.-]*:/i.test(href)) { a.target = '_blank'; a.rel = 'noopener'; continue; }
    if (href.startsWith('#')) continue;
    const r = resolveRel(href, from);
    if (r) a.setAttribute('href', hrefFor(r.path, r.heading));
    else a.classList.add('broken');
  }
  for (const img of root.querySelectorAll('img[src]')) {
    const src = img.getAttribute('src');
    if (/^[a-z][a-z0-9+.-]*:/i.test(src)) continue;
    const r = resolveRel(src, from);
    img.removeAttribute('src');
    if (r) img.dataset.src = r.path;
  }
  for (const h of root.querySelectorAll('h1,h2,h3,h4,h5,h6')) h.id = h.textContent.trim();
  for (const t of root.querySelectorAll('table')) {
    const w = document.createElement('div');
    w.className = 'scroll';
    t.replaceWith(w);
    w.append(t);
  }
  for (const bq of root.querySelectorAll('blockquote')) {
    const p = bq.firstElementChild;
    const tn = p && p.tagName === 'P' ? p.firstChild : null;
    const m = tn && tn.nodeType === 3 && /^\[!([\w-]+)\][+-]?[ \t]*([^\n]*)\n?/.exec(tn.nodeValue);
    if (!m) continue;
    bq.classList.add('callout', 'callout-' + m[1].toLowerCase());
    tn.nodeValue = tn.nodeValue.slice(m[0].length);
    if (p.firstChild === tn && !tn.nodeValue && tn.nextSibling && tn.nextSibling.nodeName === 'BR') tn.nextSibling.remove();
    const title = document.createElement('div');
    title.className = 'callout-title';
    title.textContent = m[2] || m[1];
    bq.prepend(title);
  }
}

async function loadImages(root) {
  for (const img of root.querySelectorAll('img[data-src]')) {
    const path = img.dataset.src;
    try {
      if (!imgCache.has(path)) {
        const b = await (await raw(path)).blob();
        imgCache.set(path, URL.createObjectURL(new Blob([b], { type: IMG_TYPES[ext(path)] || b.type })));
      }
      img.src = imgCache.get(path);
    } catch (e) {
      img.replaceWith(Object.assign(document.createElement('span'), { className: 'broken', textContent: '[이미지 로드 실패: ' + path + ']' }));
    }
  }
}

// mermaid 블록이 있는 노트에서만 라이브러리를 받는다
let mermaidLib = null;
async function renderMermaid(root) {
  const blocks = [...root.querySelectorAll('pre > code.language-mermaid')];
  if (!blocks.length) return;
  try {
    if (!mermaidLib) {
      mermaidLib = (await import('https://cdn.jsdelivr.net/npm/mermaid@12.0.0/dist/mermaid.esm.min.mjs')).default;
      mermaidLib.initialize({ startOnLoad: false, securityLevel: 'strict',
        theme: matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'default' });
    }
    const nodes = blocks.map(code => {
      const div = document.createElement('div');
      div.className = 'mermaid';
      div.textContent = code.textContent;
      code.parentElement.replaceWith(div);
      return div;
    });
    await mermaidLib.run({ nodes, suppressErrors: true });
  } catch (e) {
    console.error('mermaid', e);
  }
}

// ---------- 화면 ----------
function showSetup(msg) {
  crumb.textContent = '';
  main.innerHTML = `
    <div class="setup">
      <h2>볼트 연결</h2>
      ${msg ? `<p class="err">${esc(msg)}</p>` : ''}
      <ol>
        <li><a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">GitHub 토큰 생성 페이지</a>를 엽니다.</li>
        <li>Repository access에서 <b>Only select repositories</b>를 고르고 볼트 저장소 하나만 선택합니다.</li>
        <li>Permissions → Repository permissions에서 <b>Contents</b>를 <b>Read-only</b>로 둡니다. 나머지는 건드리지 않습니다.</li>
        <li>만료일을 정하고 생성한 뒤, 토큰을 아래에 붙여 넣습니다.</li>
      </ol>
      <label for="repo">저장소 (owner/repo)</label>
      <input id="repo" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="owner/repo" value="${esc(cfg.repo)}">
      <label for="token">토큰</label>
      <input id="token" type="password" autocomplete="off" placeholder="github_pat_...">
      <p class="muted" style="font-size:14px">토큰은 이 기기의 브라우저에만 저장되고 GitHub API 외에는 보내지 않습니다.</p>
      <button id="save">연결</button>
      ${cfg.token ? '<button id="logout">토큰 삭제</button>' : ''}
    </div>`;
  document.getElementById('save').onclick = async () => {
    const repoIn = document.getElementById('repo').value.trim();
    const m = /(?:github\.com\/)?([\w.-]+\/[\w.-]+?)(?:\.git)?\/?$/.exec(repoIn);
    const token = document.getElementById('token').value.trim() || cfg.token;
    if (!m || !token) return showSetup('저장소와 토큰을 모두 입력하세요.');
    cfg = { repo: m[1], token };
    try {
      main.innerHTML = '<p class="muted">연결 확인 중…</p>';
      await loadTree();
    } catch (e) {
      if (e.message !== '401') showSetup('연결 실패: ' + e.message);
      return;
    }
    localStorage.setItem(LS_REPO, cfg.repo);
    localStorage.setItem(LS_TOKEN, cfg.token);
    goHome();
  };
  const lo = document.getElementById('logout');
  if (lo) lo.onclick = () => { localStorage.removeItem(LS_TOKEN); cfg.token = ''; showSetup(); };
}

function buildTree(paths) {
  const root = {};
  for (const p of paths) {
    let node = root;
    const segs = p.split('/');
    segs.slice(0, -1).forEach(s => { node = node[s + '/'] = node[s + '/'] || {}; });
    node[segs.at(-1)] = p;
  }
  const html = (node, dir) => Object.keys(node)
    .sort((a, b) => (b.endsWith('/') - a.endsWith('/')) || a.localeCompare(b, 'ko'))
    .map(k => k.endsWith('/')
      ? `<details data-dir="${esc(dir + k)}"${openDirs.has(dir + k) ? ' open' : ''}><summary>${esc(k.slice(0, -1))}</summary>${html(node[k], dir + k)}</details>`
      : `<a class="f" href="${hrefFor(node[k])}">${esc(baseName(k))}</a>`)
    .join('');
  return html(root, '');
}

function renderList() {
  const terms = query.toLowerCase().split(/\s+/).filter(Boolean);
  const md = files.filter(p => ext(p) === 'md');
  const box = document.getElementById('list');
  if (!terms.length) { box.className = 'tree'; box.innerHTML = buildTree(md); return; }
  const hits = md.filter(p => terms.every(t => p.toLowerCase().includes(t)));
  box.className = 'results';
  box.innerHTML = hits.length
    ? hits.map(p => `<a class="f" href="${hrefFor(p)}">${esc(baseName(p))}<small>${esc(p)}</small></a>`).join('')
    : '<p class="muted">결과 없음</p>';
}

function showHome() {
  currentPath = '';
  crumb.textContent = cfg.repo;
  main.innerHTML = `
    <div class="toolbar"><button id="reload">목록 새로고침</button></div>
    <input id="q" type="search" placeholder="파일명·경로 검색" value="${esc(query)}">
    <div id="list"></div>`;
  const q = document.getElementById('q');
  q.oninput = () => { query = q.value; renderList(); };
  document.getElementById('list').addEventListener('toggle', e => {
    const d = e.target.dataset.dir;
    if (d) e.target.open ? openDirs.add(d) : openDirs.delete(d);
  }, true);
  document.getElementById('reload').onclick = async () => {
    main.innerHTML = '<p class="muted">불러오는 중…</p>';
    try { await loadTree(); showHome(); } catch (e) { if (e.message !== '401') main.innerHTML = `<p class="err">${esc(e.message)}</p>`; }
  };
  renderList();
  window.scrollTo(0, homeScroll);
}

function scrollToHeading(heading) {
  const el = heading && [...main.querySelectorAll('h1,h2,h3,h4,h5,h6')].find(h => h.id.toLowerCase() === heading.trim().toLowerCase());
  if (el) el.scrollIntoView(); else window.scrollTo(0, 0);
}

async function showFile(path, heading) {
  if (path === currentPath && main.querySelector('.note')) return scrollToHeading(heading);
  const seq = ++renderSeq;
  currentPath = path;
  crumb.textContent = path;
  main.innerHTML = '<p class="muted">불러오는 중…</p>';
  window.scrollTo(0, 0);
  const box = document.createElement('article');
  box.className = 'note';
  try {
    if (IMG_TYPES[ext(path)]) {
      box.innerHTML = `<img data-src="${esc(path)}" alt="">`;
    } else if (ext(path) === 'md') {
      const text = await (await raw(path)).text();
      if (seq !== renderSeq) return;
      // 문서에 붙이기 전에 고쳐야 상대 경로 이미지가 엉뚱한 주소로 요청되지 않는다
      const frag = DOMPurify.sanitize(marked.parse(stripFrontmatter(text)), { RETURN_DOM_FRAGMENT: true });
      postProcess(frag, path);
      box.append(frag);
    } else {
      box.innerHTML = '<p class="muted">이 형식은 뷰어에서 볼 수 없습니다.</p>';
    }
  } catch (e) {
    if (e.message === '401' || seq !== renderSeq) return;
    main.innerHTML = `<p class="err">불러오기 실패: ${esc(e.message)}</p>`;
    return;
  }
  main.replaceChildren(box);
  scrollToHeading(heading);
  loadImages(box);
  renderMermaid(box);
}

function route() {
  if (!cfg.token || !cfg.repo) return showSetup();
  if (document.getElementById('list')) homeScroll = window.scrollY;
  const h = location.hash.slice(1);
  if (!h) return showHome();
  const i = h.indexOf('?h=');
  showFile(dec(i < 0 ? h : h.slice(0, i)), i < 0 ? '' : dec(h.slice(i + 3)));
}

function goHome() { if (location.hash) location.hash = ''; else route(); }

document.getElementById('home').onclick = goHome;
document.getElementById('settings').onclick = () => showSetup();
window.addEventListener('hashchange', route);

(async () => {
  cfg = { token: localStorage.getItem(LS_TOKEN) || '', repo: localStorage.getItem(LS_REPO) || '' };
  if (!cfg.token || !cfg.repo) return showSetup();
  main.innerHTML = '<p class="muted">불러오는 중…</p>';
  try { await loadTree(); } catch (e) {
    if (e.message !== '401') main.innerHTML = `<p class="err">연결 실패: ${esc(e.message)}</p><p><button onclick="location.reload()">다시 시도</button></p>`;
    return;
  }
  route();
})();

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
